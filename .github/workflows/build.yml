name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      # PASO CLAVE: instalar los assemblies de referencia de .NET 4.0
      - name: Install .NET 4.0 Targeting Pack via NuGet
        run: |
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 -Version 1.0.3 -OutputDirectory c:\refs
          xcopy /E /I c:\refs\Microsoft.NETFramework.ReferenceAssemblies.net40.1.0.3\build\.NETFramework "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework"

      - name: Restore NuGet packages
        run: nuget restore NotAORM.sln

      - name: Build solution in Release
        run: msbuild NotAORM.sln -t:rebuild -property:Configuration=Release -property:Platform="Any CPU"

      - name: Copy artifacts to staging
        run: |
          mkdir staging
          copy NotAORM\bin\Release\NotAORM.dll staging\
          copy NotAORM\bin\Release\NotAORM.pdb staging\
          if (Test-Path NotAORM\bin\Release\NotAORM.xml) { copy NotAORM\bin\Release\NotAORM.xml staging\ }
        shell: pwsh

      # Firma digital solo para tags
      - name: Decode PFX certificate (only on tags)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $pfxBytes = [Convert]::FromBase64String("${{ secrets.PFX_BASE64 }}")
          [IO.File]::WriteAllBytes("${{ runner.temp }}\NotAORM.pfx", $pfxBytes)
        shell: pwsh

      - name: Sign the DLL (only on tags)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $signtool = Get-ChildItem -Recurse -Filter "signtool.exe" -Path "C:\Program Files (x86)\Windows Kits" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) {
            $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x86\signtool.exe"
          }
          & $signtool sign /f "${{ runner.temp }}\NotAORM.pfx" /p "${{ secrets.PFX_PASSWORD }}" /fd SHA256 /t http://timestamp.digicert.com staging\NotAORM.dll
        shell: powershell

      - name: Package artifacts (only on tags)
        if: startsWith(github.ref, 'refs/tags/')
        run: Compress-Archive -Path staging\* -DestinationPath NotAORM-${{ github.ref_name }}.zip

      - name: Create GitHub Release and upload asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: NotAORM-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}