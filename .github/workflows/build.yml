name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      - name: Restore NuGet packages
        run: nuget restore NotAORM.sln

      - name: Build solution in Release
        run: msbuild NotAORM.sln /p:Configuration=Release /p:Platform="Any CPU" /p:OutputPath=bin\Release

      - name: Decode PFX certificate (only on tags)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $pfxBytes = [Convert]::FromBase64String("${{ secrets.PFX_BASE64 }}")
          [IO.File]::WriteAllBytes("${{ runner.temp }}\NotAORM.pfx", $pfxBytes)
        shell: pwsh

      - name: Sign the DLL (only on tags)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x86\signtool.exe"
          & $signtool sign /f "${{ runner.temp }}\NotAORM.pfx" /p "${{ secrets.PFX_PASSWORD }}" /fd SHA256 /t http://timestamp.digicert.com NotAORM\bin\Release\NotAORM.dll
        shell: powershell

      - name: Prepare release artifacts (only on tags)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir artifacts
          copy NotAORM\bin\Release\NotAORM.dll artifacts\
          copy NotAORM\bin\Release\NotAORM.pdb artifacts\
          if (Test-Path NotAORM\bin\Release\NotAORM.xml) { copy NotAORM\bin\Release\NotAORM.xml artifacts\ }
          Compress-Archive -Path artifacts\* -DestinationPath NotAORM-${{ github.ref_name }}.zip
        shell: pwsh

      - name: Create GitHub Release and upload asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: NotAORM-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
